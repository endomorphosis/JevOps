[pytest]
testpaths = tests
addopts = --test-seal=on
test_seal_roots =
    jevops
    tests
    papers/completion/lean_refactor_arena
# These shared fixtures invoke native Lean and have untracked toolchain inputs.
# Transitive consumers stay fresh even when the fixture's setup ran earlier.
test_seal_fresh_fixtures =
    captured
    native_wire
    native_report
    experiment
    compound_run
    transfer_run
    native_router_run
    module_environment
    live_profile
