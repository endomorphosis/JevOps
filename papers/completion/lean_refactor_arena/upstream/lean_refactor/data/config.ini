
[PLANNER_AGENT_LLM]
# some possible options: claude-haiku-4-5-20251001 claude-opus-4-6 gemini-3-flash-preview
model = claude-haiku-4-5-20251001
# some possible options: anthropic, gemini, openai, vllm
provider = anthropic
max_tokens = 60000
max_remote_retries = 10
max_correction_attempts = 3
max_correction_attempts_high = 3
max_correction_attempts_medium = 3
max_correction_attempts_low = 3
max_replans = 30
min_replans = 30
# api_budget is the number of API calls for each problem, default to 30
api_budget = 30


[EXECUTER_AGENT_LLM]
model = claude-haiku-4-5-20251001
provider = anthropic
max_tokens = 60000
max_remote_retries = 10

[LEAN_CLIENT_SERVER]
max_retries = 5
workspace_path = entered_via_command_line_args
max_concurrent_workers = 15
timeout = 600

[FINDER_AGENT_LLM]
model = claude-haiku-4-5-20251001
provider = anthropic
max_tokens = 60000
max_remote_retries = 10
max_results_per_query = 3
retrieval_server_url = https://bxrituxuhpc70w8w.us-east-1.aws.endpoints.huggingface.cloud
